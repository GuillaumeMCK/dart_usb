name: dusb
description: >-
  Cross-platform low-level access to USB devices for Dart and Flutter,
  bridging the Rust nusb crate with flutter_rust_bridge and build hooks.
version: 0.1.0
repository: https://github.com/GuillaumeMCK/dusb
issue_tracker: https://github.com/GuillaumeMCK/dusb/issues

environment:
  sdk: ^3.14.0

dependencies:
  ffi: ^2.2.0
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.17.1
  freezed: ^4.0.3
  lints: ^6.1.0
  test: ^1.31.0
