[toolchain]
# native_toolchain_rust (used by hook/build.dart) requires an exact version
# for reproducible builds. Targets: the platforms nusb supports.
channel = "1.93.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]
