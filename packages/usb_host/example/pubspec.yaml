name: usb_host_example
description: "Demonstrates how to use the usb_host plugin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  usb_host:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

# usb_models is a sibling package in this workspace, not yet on pub.dev.
dependency_overrides:
  usb_models:
    path: ../../usb_models
