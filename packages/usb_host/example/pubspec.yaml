name: usb_host_example
description: "Demonstrates how to use the usb_host plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  usb_host:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter


flutter:

  uses-material-design: true





# usb_models is a sibling package in this workspace, not yet on pub.dev.
dependency_overrides:
  usb_models:
    path: ../../usb_models
