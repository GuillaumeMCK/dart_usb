[package]
name = "usb_gadget_native"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge bindings for the usb-gadget crate"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flutter_rust_bridge = "=2.13.0"
libc = "0.2"
parking_lot = "0.12"
macaddr = "1"
usb-gadget = "1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
