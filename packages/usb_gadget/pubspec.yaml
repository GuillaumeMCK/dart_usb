name: usb_gadget
description: >-
  USB gadgets for Linux in Dart: kernel functions and FunctionFS functions
  written in Dart, bridging the Rust usb-gadget crate.
version: 2.0.0
repository: https://github.com/GuillaumeMCK/usb-gadget/tree/main/packages/usb_gadget
issue_tracker: https://github.com/GuillaumeMCK/usb-gadget/issues

platforms:
  linux:

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  code_assets: ^2.2.0
  ffi: ^2.1.5
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  meta: ^1.17.0
  usb_models: ^0.1.0

dev_dependencies:
  test: ^1.25.0
  usb_host: ^0.1.0
